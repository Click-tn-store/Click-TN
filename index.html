<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click-TN Store | المتجر المتكامل 🇹🇳</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* العودة للألوان الأصلية التي تحبها */
        :root { 
            --primary: #2563eb; 
            --bg: #0f172a; 
            --card-bg: #1e293b;
            --text-main: #ffffff;
            --text-dim: #94a3b8;
            --success: #25d366; 
            --border: #334155;
        }

        body { 
            font-family: 'Tajawal', sans-serif; 
            background-color: var(--bg); 
            color: var(--text-main); 
            margin: 0; 
            text-align: center;
        }

        header { padding: 40px 20px; background: #1e293b; border-bottom: 2px solid var(--primary); }
        .logo { font-size: 2.5rem; font-weight: 900; }
        .logo .blue { color: var(--primary); }

        /* شريط البحث الحقيقي بنفس تصميمك الأصلي */
        .search-container { max-width: 600px; margin: 20px auto; padding: 0 15px; }
        .search-bar { 
            width: 100%; 
            background: #1e293b; 
            border: 1px solid var(--border); 
            padding: 15px; 
            border-radius: 12px; 
            color: white; 
            text-align: right;
            outline: none;
        }

        .container { 
            padding: 20px; 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 20px; 
            max-width: 1200px; 
            margin: auto; 
        }

        .card { 
            background: var(--card-bg); 
            border-radius: 20px; 
            padding: 20px; 
            border: 1px solid var(--border);
            transition: 0.3s;
        }

        .card img { width: 100%; border-radius: 15px; margin-bottom: 15px; }
        
        select { 
            width: 100%; padding: 12px; border-radius: 10px; 
            background: #0f172a; color: white; border: 1px solid var(--border);
            margin-bottom: 15px; font-family: 'Tajawal';
        }

        .btn { 
            background: var(--primary); color: white; width: 100%; 
            padding: 15px; border-radius: 10px; font-weight: bold; 
            border: none; cursor: pointer; font-size: 1rem;
        }

        .whatsapp-float { 
            position: fixed; bottom: 20px; left: 20px; 
            background: var(--success); width: 60px; height: 60px; 
            border-radius: 50%; display: flex; align-items: center; 
            justify-content: center; z-index: 1000;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">Click-<span class="blue">TN</span> Store</div>
    <p>متجرك الأول لشحن الألعاب والخدمات في تونس 🇹🇳</p>
</header>

<div class="search-container">
    <input type="text" id="searchInput" class="search-bar" placeholder="🔍 ابحث عن عرضك..." onkeyup="searchProducts()">
</div>

<div class="container" id="productsContainer">
    <div class="card">
        <img src="https://upload.wikimedia.org/wikipedia/en/a/af/Free_Fire_Logo.png" alt="Free Fire">
        <h3>جواهر فري فاير (ID)</h3>
        <select id="ff-opt">
            <option value="100 جوهرة - 4.500 DT">100 جوهرة - 4.500 DT</option>
            <option value="210 جوهرة - 8.500 DT">210 جوهرة - 8.500 DT</option>
            <option value="570 جوهرة - 16.500 DT">570 جوهرة - 16.500 DT</option>
        </select>
        <button class="btn" onclick="order('فري فاير', 'ff-opt')">اشحن الآن</button>
    </div>

    <div class="card">
        <img src="https://upload.wikimedia.org/wikipedia/commons/e/e8/Binance_Logo.svg" alt="Binance">
        <h3>شحن USDT باينانس</h3>
        <select id="usdt-opt">
            <option value="10 USDT - 34.500 DT">10 USDT - 34.500 DT</option>
            <option value="20 USDT - 68.000 DT">20 USDT - 68.000 DT</option>
        </select>
        <button class="btn" onclick="order('باينانس', 'usdt-opt')">اشحن الآن</button>
    </div>

    <div class="card">
        <img src="https://w7.pngwing.com/pngs/514/716/png-transparent-pubg-mobile-playerunknown-s-battlegrounds-game-logo-thumbnail.png" alt="PUBG">
        <h3>شدات ببجي (UC)</h3>
        <select id="pubg-opt">
            <option value="325 UC - 18.500 DT">325 UC - 18.500 DT</option>
            <option value="660 UC - 36.000 DT">660 UC - 36.000 DT</option>
        </select>
        <button class="btn" onclick="order('ببجي', 'pubg-opt')">اشحن الآن</button>
    </div>
</div>

<a href="https://wa.me/21646326474" class="whatsapp-float" target="_blank">
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" width="35">
</a>

<script>
    // برمجة البحث الحقيقي
    function searchProducts() {
        let input = document.getElementById('searchInput').value.toLowerCase();
        let cards = document.getElementsByClassName('card');
        
        for (let i = 0; i < cards.length; i++) {
            let title = cards[i].getElementsByTagName('h3')[0].innerText.toLowerCase();
            if (title.includes(input)) {
                cards[i].style.display = "";
            } else {
                cards[i].style.display = "none";
            }
        }
    }

    // دالة الطلب برقمك الصحيح
    function order(product, selectId) {
        let price = document.getElementById(selectId).value;
        let message = `سلام، نحب نطلب ${product}: ${price}`;
        window.open(`https://wa.me/21646326474?text=${encodeURIComponent(message)}`, '_blank');
    }
</script>

</body>
</html>
