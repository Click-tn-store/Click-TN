<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click-TN Store | المتجر الرسمي 🇹🇳</title>
    <style>
        :root { --primary: #e94560; --bg: #0f172a; --card: #1e293b; --success: #25d366; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f172a; color: white; margin: 0; text-align: center; }
        header { padding: 30px; border-bottom: 3px solid var(--primary); background: #1e293b; }
        .logo { font-size: 2.5rem; font-weight: bold; }
        .logo span { color: var(--primary); }
        .container { padding: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; max-width: 1200px; margin: auto; }
        .card { background: var(--card); border-radius: 15px; overflow: hidden; padding-bottom: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); transition: 0.3s; }
        .card:hover { transform: translateY(-5px); border: 1px solid var(--primary); }
        .card-image-box { width: 100%; height: 200px; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #000; }
        .card-image-box img { width: 100%; height: 100%; object-fit: cover; }
        .info { padding: 15px; }
        select { width: 90%; padding: 10px; border-radius: 8px; margin-bottom: 15px; background: #0f172a; color: white; border: 1px solid #334155; }
        .btn { background: var(--primary); color: white; width: 90%; padding: 12px; border-radius: 10px; font-weight: bold; border: none; cursor: pointer; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(5px); }
        .modal-content { background: #1e293b; margin: 15% auto; padding: 25px; border-radius: 15px; width: 80%; max-width: 350px; border: 1px solid var(--primary); }
        .pay-btn { display: block; width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        .d17 { background: #ffcc00; color: #000; }
        .flouci { background: #6c5ce7; color: #fff; }
        .whatsapp-float { position: fixed; bottom: 20px; right: 20px; background: var(--success); width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 999; font-size: 30px; }
    </style>
</head>
<body>

<header>
    <div class="logo">Click-<span>TN</span> Store</div>
    <p>متجرك الموثوق للشحن والتسوق في تونس 🇹🇳</p>
</header>

<div class="container">
    <div class="card">
        <div class="card-image-box"><img src="86903d98-3a6d-4365-8896-863e6a1e2698.jfif" alt="AliExpress"></div>
        <div class="info">
            <h3>AliExpress 📦</h3>
            <button onclick="directOrder('AliExpress')" class="btn">اطلب عبر واتساب</button>
        </div>
    </div>

    <div class="card">
        <div class="card-image-box"><img src="836befd9-172d-4758-864d-0cf6133ee6d2.jfif" alt="Ubuy"></div>
        <div class="info">
            <h3>Ubuy 🛒</h3>
            <button onclick="directOrder('Ubuy')" class="btn">اطلب عبر واتساب</button>
        </div>
    </div>

    <div class="card">
        <div class="card-image-box"><img src="cb415333-7c59-478c-86d6-8ef7f233c30c.jfif" alt="PUBG"></div>
        <div class="info">
            <h3>ببجي موبايل (UC)</h3>
            <select id="pubg-options">
                <option value="60 UC بـ 4.500 DT">60 UC - 4.500 DT</option>
                <option value="325 UC بـ 19.500 DT">325 UC - 19.500 DT</option>
                <option value="660 UC بـ 38.000 DT">660 UC - 38.000 DT</option>
            </select>
            <button onclick="openModal('ببجي موبايل', 'pubg-options')" class="btn">شحن الآن</button>
        </div>
    </div>

    <div class="card">
        <div class="card-image-box"><img src="724a7aa0-ffcb-48a4-aae7-daa318d5db2c (1).jfif" alt="Free Fire"></div>
        <div class="info">
            <h3>فري فاير (💎)</h3>
            <select id="ff-options">
                <option value="100 جوهرة بـ 4.000 DT">100 جوهرة - 4.000 DT</option>
                <option value="210 جوهرة بـ 8.200 DT">210 جوهرة - 8.200 DT</option>
            </select>
            <button onclick="openModal('فري فاير', 'ff-options')" class="btn">شحن الآن</button>
        </div>
    </div>

    <div class="card">
        <div class="card-image-box"><img src="6d6b53a6-9bab-4610-9ccc-03db3374c199.jfif" alt="USDT"></div>
        <div class="info">
            <h3>عملة USDT 💵</h3>
            <select id="usdt-options">
                <option value="10 USDT بـ 36.500 DT">10 USDT - 36.500 DT</option>
            </select>
            <button onclick="openModal('USDT', 'usdt-options')" class="btn">اطلب الآن</button>
        </div>
    </div>

    <div class="card">
        <div class="card-image-box"><img src="448e0a1c-bceb-4852-812e-00df4e58d4ef.jfif" alt="Netflix"></div>
        <div class="info">
            <h3>نتفليكس (🎬)</h3>
            <select id="netflix-options">
                <option value="شهر Premium بـ 15.000 DT">شهر Premium - 15.000 DT</option>
            </select>
            <button onclick="openModal('نتفليكس', 'netflix-options')" class="btn">اشترك الآن</button>
        </div>
    </div>

    <div class="card">
        <div class="card-image-box"><img src="115821d3-d878-458f-b7cc-c09b2befd34d.jfif" alt="TikTok"></div>
        <div class="info">
            <h3>تيك توك (📱)</h3>
            <select id="tiktok-options">
                <option value="1000 Coin بـ 45.000 DT">1000 Coin - 45.000 DT</option>
            </select>
            <button onclick="openModal('تيك توك', 'tiktok-options')" class="btn">شحن الآن</button>
        </div>
    </div>
</div>

<div id="paymentModal" class="modal">
    <div class="modal-content">
        <h3>اختر وسيلة الدفع</h3>
        <button onclick="sendOrder('D17')" class="pay-btn d17">D17 💳</button>
        <button onclick="sendOrder('Flouci')" class="pay-btn flouci">Flouci 📱</button>
        <button onclick="closeModal()" style="background:none; color:white; border:none; margin-top:10px; cursor:pointer;">إلغاء</button>
    </div>
</div>

<a href="https://wa.me/21646326474" class="whatsapp-float" target="_blank">💬</a>

<script>
    let cP = ""; let cO = "";
    function openModal(p, s) { cP = p; cO = document.getElementById(s).value; document.getElementById("paymentModal").style.display = "block"; }
    function closeModal() { document.getElementById("paymentModal").style.display = "none"; }
    function sendOrder(m) {
        let msg = "مرحباً Click-TN Store 👋\nالمنتج: " + cP + "\nالعرض: " + cO + "\nالدفع: " + m;
        window.open("https://wa.me/21646326474?text=" + encodeURIComponent(msg), '_blank');
        closeModal();
    }
    function directOrder(p) {
        let msg = "مرحباً Click-TN Store 👋\nأريد الشراء من منصة: " + p + "\nسأرسل لك الرابط الآن.";
        window.open("https://wa.me/21646326474?text=" + encodeURIComponent(msg), '_blank');
    }
</script>
</body>
</html>
