<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click-TN Store | الأسعار المحدثة 🇹🇳</title>
    <style>
        :root { --primary: #e94560; --bg: #0f172a; --card: #1e293b; --success: #25d366; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: white; margin: 0; text-align: center; }
        header { padding: 40px 20px; background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); border-bottom: 4px solid var(--primary); }
        .container { padding: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; max-width: 1200px; margin: auto; }
        .card { background: var(--card); border-radius: 20px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); transition: 0.3s; padding-bottom: 20px; }
        .card:hover { transform: translateY(-5px); border-color: var(--primary); }
        .icon-box { height: 100px; display: flex; align-items: center; justify-content: center; font-size: 50px; background: rgba(255,255,255,0.05); }
        .info { padding: 15px; }
        h3 { margin: 10px 0; font-size: 1.2rem; color: #fff; }
        select { width: 90%; padding: 12px; border-radius: 10px; border: 2px solid #334155; background: #0f172a; color: white; font-size: 1rem; margin-bottom: 15px; outline: none; cursor: pointer; }
        .btn { background: var(--primary); color: white; text-decoration: none; display: inline-block; width: 90%; padding: 15px; border-radius: 12px; font-weight: bold; border: none; cursor: pointer; font-size: 1rem; }
        .btn:hover { background: #ff2e63; box-shadow: 0 0 15px rgba(233, 69, 96, 0.4); }
        .whatsapp-float { position: fixed; bottom: 20px; right: 20px; background: var(--success); width: 65px; height: 65px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 999; font-size: 35px; }
    </style>
</head>

</script>
