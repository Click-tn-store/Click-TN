<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <style>
        :root { --primary: #e94560; --bg: #1a1a2e; --card-bg: #16213e; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: white; margin: 0; text-align: center; }
        header { padding: 40px 20px; background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://i.postimg.cc/mD8z67Xy/freefire.jpg'); background-size: cover; background-position: center; border-bottom: 4px solid var(--primary); }
        h1 { margin: 0; font-size: 2.5rem; text-shadow: 2px 2px 10px rgba(0,0,0,0.5); }
        .container { padding: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; max-width: 1000px; margin: auto; }
        .card { background: var(--card-bg); border-radius: 20px; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.3); transition: 0.3s; border: 1px solid rgba(255,255,255,0.1); }
        .card:hover { transform: translateY(-10px); border-color: var(--primary); }
        .card img { width: 100%; height: 180px; object-fit: cover; }
        .card-info { padding: 20px; }
        .price { font-size: 1.5rem; color: #4eff4e; font-weight: bold; margin: 10px 0; }
        .btn { background: var(--primary); color: white; text-decoration: none; display: block; padding: 12px; border-radius: 10px; font-weight: bold; transition: 0.3s; }
        .btn:hover { background: #ff2e63; }
        
        /* زر واتساب العائم */
        .whatsapp-btn { position: fixed; bottom: 20px; right: 20px; background: #25d366; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: 0 5px 15px rgba(0,0,0,0.4); z-index: 1000; text-decoration: none; }
    </style>
</head>
