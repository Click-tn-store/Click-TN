    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <style>
        :root { 
            --primary: #e94560; 
            --bg: #0f172a; 
            --card: rgba(30, 41, 59, 0.6); /* شفافية لزيادة جمال الخلفية */
            --success: #25d366; 
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg); 
            color: white; 
            margin: 0; 
            text-align: center;
        }

        /* تنسيق حاوية الخلفية المتحركة */
        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1; /* خلف المنتجات */
            background: linear-gradient(135deg, #0f172a 0%, #16213e 100%);
        }

        header { 
            padding: 40px 20px; 
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 3px solid var(--primary);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .logo { font-size: 2.8rem; font-weight: bold; text-shadow: 0 0 15px var(--primary); }
        .logo span { color: var(--primary); }

        .container { 
            padding: 30px 15px; 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 25px; 
            max-width: 1200px; 
            margin: auto; 
        }

        .card { 
            background: var(--card); 
            backdrop-filter: blur(10px); /* تأثير الزجاج المغبش */
            border-radius: 20px; 
            overflow: hidden; 
            padding-bottom: 15px; 
            transition: 0.4s ease; 
            border: 1px solid rgba(255,255,255,0.05);
        }

        .card:hover { 
            transform: translateY(-10px); 
            border-color: var(--primary); 
            box-shadow: 0 0 25px rgba(233, 69, 96, 0.4);
        }

        .card-image-box { 
            width: 100%; height: 200px; overflow: hidden; 
            display: flex; align-items: center; justify-content: center; background: #000; 
        }
        .card-image-box img { width: 100%; height: 100%; object-fit: cover; }

        .info { padding: 15px; }
        .info h3 { margin-bottom: 15px; font-size: 1.3rem; }

        select { 
            width: 90%; padding: 12px; border-radius: 10px; margin-bottom: 15px; 
            background: #0f172a; color: white; border: 1px solid #334155; cursor: pointer;
        }

        .btn { 
            background: linear-gradient(45deg, var(--primary), #ff2e63);
            color: white; width: 90%; padding: 12px; border-radius: 10px; 
            font-weight: bold; border: none; cursor: pointer; transition: 0.3s;
        }
        .btn:hover { transform: scale(1.05); box-shadow: 0 5px 15px rgba(233, 69, 96, 0.4); }

        /* Modal Styles */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(5px); }
        .modal-content { background: #1e293b; margin: 15% auto; padding: 25px; border-radius: 15px; width: 85%; max-width: 350px; border: 1px solid var(--primary); }
        .pay-btn { display: block; width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        .d17 { background: #ffcc00; color: #000; }
        .flouci { background: #6c5ce7; color: #fff; }

        .whatsapp-float { 
            position: fixed; bottom: 25px; right: 25px; background: var(--success); 
            width: 65px; height: 65px; border-radius: 50%; display: flex; 
            align-items: center; justify-content: center; text-decoration: none; 
            font-size: 35px; box-shadow: 0 5px 20px rgba(0,0,0,0.4); z-index: 100;
        }
    </style>
</head>

<a href="https://wa.me/21646326474" class="whatsapp-float" target="_blank">💬</a>

<script>
    // تهيئة الجزيئات المتحركة
    particlesJS("particles-js", {
        "particles": {
            "number": { "value": 70, "density": { "enable": true, "value_area": 800 } },
            "color": { "value": "#e94560" },
            "shape": { "type": "circle" },
            "opacity": { "value": 0.5, "random": false },
            "size": { "value": 3, "random": true },
            "line_linked": { "enable": true, "distance": 150, "color": "#e94560", "opacity": 0.3, "width": 1 },
            "move": { "enable": true, "speed": 2, "direction": "none", "random": false, "straight": false, "out_mode": "out", "bounce": false }
        },
        "interactivity": {
            "detect_on": "canvas",
            "events": { "onhover": { "enable": true, "mode": "repulse" }, "onclick": { "enable": true, "mode": "push" }, "resize": true },
            "modes": { "repulse": { "distance": 100, "duration": 0.4 }, "push": { "particles_nb": 4 } }
        },
        "retina_detect": true
    });

    let cP = ""; let cO = "";
    function openModal(p, s) { 
        cP = p; 
        cO = document.getElementById(s).value; 
        document.getElementById("paymentModal").style.display = "block"; 
    }
    function closeModal() { document.getElementById("paymentModal").style.display = "none"; }
    function sendOrder(m) {
        let msg = "مرحباً Click-TN Store 👋\nالمنتج: " + cP + "\nالعرض: " + cO + "\nالدفع: " + m;
        window.open("https://wa.me/21646326474?text=" + encodeURIComponent(msg), '_blank');
        closeModal();
    }
    function directOrder(p) {
        let msg = "مرحباً Click-TN Store 👋\nأريد الشراء من منصة: " + p;
        window.open("https://wa.me/21646326474?text=" + encodeURIComponent(msg), '_blank');
    }
</script>
