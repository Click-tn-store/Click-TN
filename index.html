<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click-TN Store | المتجر المتكامل 🇹🇳</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #e94560; 
            --bg: #f4f7fa; 
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-dim: #64748b;
            --success: #25d366; 
            --border: #e2e8f0;
        }

        body { 
            font-family: 'Tajawal', sans-serif; 
            background-color: var(--bg); 
            color: var(--text-main); 
            margin: 0; 
            padding-bottom: 40px;
        }

        header { 
            padding: 40px 20px; 
            background: white;
            border-bottom: 1px solid var(--border);
            text-align: center;
            margin-bottom: 30px;
        }

        .logo { font-size: 2.8rem; font-weight: 900; letter-spacing: -1px; }
        .logo span { color: var(--primary); }

        .container { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 25px; 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 0 20px;
        }

        /* تصميم الخانة الاحترافي المعدل */
        .card { 
            background: var(--card-bg); 
            border-radius: 20px; 
            border: 1px solid var(--border);
            transition: all 0.3s ease;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .card:hover { 
            transform: translateY(-8px); 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            border-color: var(--primary);
        }

        .card-image-box { 
            width: 100%; 
            height: 200px; 
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #f1f5f9;
        }

        .card-image-box img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }

        .info { padding: 20px; text-align: center; }
        .info h3 { margin: 0 0 15px 0; font-size: 1.2rem; font-weight: 700; color: #334155; }

        select { 
            width: 100%; 
            padding: 12px; 
            border-radius: 12px; 
            margin-bottom: 15px; 
            background: #f8fafc; 
            border: 2px solid #f1f5f9; 
            font-family: 'Tajawal';
            font-weight: 500;
            outline: none;
        }

        .btn { 
            background: #1e293b;
            color: white; 
            width: 100%; 
            padding: 14px; 
            border-radius: 12px; 
            font-weight: 700; 
            border: none; 
            cursor: pointer; 
            transition: 0.3s;
        }

        .btn:hover { background: var(--primary); transform: scale(1.02); }

        /* Modal */
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); }
        .modal-content { background: white; margin: 15% auto; padding: 30px; border-radius: 25px; width: 85%; max-width: 380px; text-align: center; }
        .pay-btn { display: block; width: 100%; padding: 15px; margin: 10px 0; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; font-size: 1rem; }
        .d17 { background: #ffcc00; color: black; }
        .flouci { background: #6c5ce7; color: white; }

        .whatsapp-float { 
            position: fixed; bottom: 25px; left: 25px; 
            background: var(--success); width: 60px; height: 60px; 
            border-radius: 50%; display: flex; align-items: center; 
            justify-content: center; text-decoration: none; 
            font-size: 30px; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>

<a href="https://wa.me/21646326474" class="whatsapp-float">🟢</a>

<script>
    let cp = ""; let co = "";
    function openModal(p, s) { 
        cp = p; co = document.getElementById(s).value; 
        document.getElementById("mTitle").innerText = "طلب " + p;
        document.getElementById("mOffer").innerText = "العرض: " + co;
        document.getElementById("paymentModal").style.display = "block"; 
    }
    function closeModal() { document.getElementById("paymentModal").style.display = "none"; }
    function sendOrder(m) {
        let msg = "سلام Click-TN 👋\nنحب نطلب: " + cp + "\nالعرض: " + co + "\nالدفع: " + m;
        window.open("https://wa.me/21646326474?text=" + encodeURIComponent(msg), '_blank');
        closeModal();
    }
    function directOrder(p) {
        let msg = "سلام Click-TN 👋\nأريد الطلب من منصة: " + p;
        window.open("https://wa.me/21646326474?text=" + encodeURIComponent(msg), '_blank');
    }
</script>
