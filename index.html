<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click-TN Store | المتجر المتكامل 🇹🇳</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #2563eb; 
            --bg: #0f172a; 
            --card-bg: #1e293b;
            --text-main: #ffffff;
            --border: #334155;
        }

        body { 
            font-family: 'Tajawal', sans-serif; 
            background-color: var(--bg); 
            color: var(--text-main); 
            margin: 0; 
            text-align: center;
        }

        header { padding: 40px 20px; background: #1e293b; border-bottom: 2px solid var(--primary); }
        .logo { font-size: 2.5rem; font-weight: 900; }
        .logo .blue { color: var(--primary); }

        .search-container { max-width: 600px; margin: 20px auto; padding: 0 15px; }
        .search-bar { 
            width: 100%; 
            background: #1e293b; 
            border: 1px solid var(--border); 
            padding: 15px; 
            border-radius: 12px; 
            color: white; 
            text-align: right;
            outline: none;
            font-family: 'Tajawal';
        }

        .container { 
            padding: 20px; 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 20px; 
            max-width: 1200px; 
            margin: auto; 
        }

        .card { 
            background: var(--card-bg); 
            border-radius: 20px; 
            padding: 20px; 
            border: 1px solid var(--border);
            transition: 0.3s;
        }
        .card:hover { transform: translateY(-5px); border-color: var(--primary); }
        .card img { width: 100%; border-radius: 15px; margin-bottom: 15px; height: 200px; object-fit: cover; }
        
        select { 
            width: 100%; padding: 12px; border-radius: 10px; 
            background: #0f172a; color: white; border: 1px solid var(--border);
            margin-bottom: 15px; font-family: 'Tajawal';
        }

        .btn { 
            background: var(--primary); color: white; width: 100%; 
            padding: 15px; border-radius: 10px; font-weight: bold; 
            border: none; cursor: pointer; font-size: 1rem;
        }

        .whatsapp-float { 
            position: fixed; bottom: 20px; left: 20px; 
            background: #25d366; width: 60px; height: 60px; 
            border-radius: 50%; display: flex; align-items: center; 
            justify-content: center; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

<header>
    <div class="logo">Click-<span class="blue">TN</span> Store</div>
    <p>متجرك المتكامل لشحن الألعاب والخدمات في تونس 🇹🇳</p>
</header>

<div class="search-container">
    <input type="text" id="searchInput" class="search-bar" placeholder="🔍 ابحث عن عرضك (مثلاً: فري فاير)..." onkeyup="searchProducts()">
</div>

<div class="container" id="productsContainer">
    
    <div class="card">
        <img src="https://upload.wikimedia.org/wikipedia/en/a/af/Free_Fire_Logo.png">
        <h3>جواهر فري فاير (ID)</h3>
        <select id="ff-opt">
            <option value="100 جوهرة بـ 4.500 DT">100 جوهرة - 4.500 DT</option>
            <option value="210 جوهرة بـ 8.500 DT">210 جوهرة - 8.500 DT</option>
            <option value="570 جوهرة بـ 16.500 DT">570 جوهرة - 16.500 DT</option>
            <option value="1140 جوهرة بـ 32.000 DT">1140 جوهرة - 32.000 DT</option>
        </select>
        <button class="btn" onclick="order('فري فاير', 'ff-opt')">اشحن الآن</button>
    </div>

    <div class="card">
        <img src="https://w7.pngwing.com/pngs/514/716/png-transparent-pubg-mobile-playerunknown-s-battlegrounds-game-logo-thumbnail.png">
        <h3>شدات ببجي (UC)</h3>
        <select id="pubg-opt">
            <option value="60 شدة بـ 4.000 DT">60 UC - 4.000 DT</option>
            <option value="325 شدة بـ 18.500 DT">325 UC - 18.500 DT</option>
            <option value="660 شدة بـ 36.000 DT">660 UC - 36.000 DT</option>
        </select>
        <button class="btn" onclick="order('ببجي', 'pubg-opt')">اشحن الآن</button>
    </div>

    <div class="card">
        <img src="https://upload.wikimedia.org/wikipedia/commons/e/e8/Binance_Logo.svg">
        <h3>شحن USDT باينانس</h3>
        <select id="usdt-opt">
            <option value="1 USDT بـ 3.500 DT">1 USDT - 3.500 DT</option>
            <option value="10 USDT بـ 34.500 DT">10 USDT - 34.500 DT</option>
            <option value="20 USDT بـ 68.000 DT">20 USDT - 68.000 DT</option>
        </select>
        <button class="btn" onclick="order('باينانس', 'usdt-opt')">اشحن الآن</button>
    </div>

    <div class="card">
        <img src="https://seeklogo.com/images/E/efootball-logo-88C15409E3-seeklogo.com.png">
        <h3>eFootball Coins</h3>
        <select id="ef-opt">
            <option value="طلب تسعيرة">تواصل لمعرفة سعر اليوم</option>
        </select>
        <button class="btn" onclick="order('إيفوتبول', 'ef-opt')">اطلب الآن</button>
    </div>

    <div class="card">
        <img src="https://img.icons8.com/fluency/96/wifi.png">
        <h3>إنترنات داتا (كل الشبكات)</h3>
        <select id="net-opt">
            <option value="25Go بـ 30.000 DT">25Go - 30.000 DT</option>
            <option value="55Go بـ 50.000 DT">55Go - 50.000 DT</option>
        </select>
        <button class="btn" onclick="order('انترنات', 'net-opt')">تفعيل الآن</button>
    </div>

    <div class="card">
        <img src="https://img.icons8.com/color/96/phone.png">
        <h3>شحن رصيد هاتف (Recharge)</h3>
        <select id="phone-opt">
            <option value="10 DT بـ 11.000 DT">10 DT - 11.000 DT</option>
            <option value="20 DT بـ 22.000 DT">20 DT - 22.000 DT</option>
        </select>
        <button class="btn" onclick="order('شحن هاتف', 'phone-opt')">اشحن الآن</button>
    </div>

    <div class="card">
        <img src="https://img.icons8.com/color/512/visa.png">
        <h3>RedotPay / Visa Card</h3>
        <select id="red-opt">
            <option value="شحن 10 دولار بـ 35.000 DT">شحن 10$ - 35.000 DT</option>
            <option value="تفعيل الكارط بـ 35.000 DT">تفعيل الكارط - 35.000 DT</option>
        </select>
        <button class="btn" onclick="order('ريدوت باي', 'red-opt')">اشحن الآن</button>
    </div>

    <div class="card">
        <img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg">
        <h3>Netflix Premium</h3>
        <select id="nf-opt">
            <option value="حساب مشترك بـ 15.000 DT">حساب مشترك شهر - 15.000 DT</option>
        </select>
        <button class="btn" onclick="order('نتفليكس', 'nf-opt')">اشترك الآن</button>
    </div>

    <div class="card">
        <img src="https://upload.wikimedia.org/wikipedia/commons/d/d1/Poste_Tunisie_%28logo%29.svg">
        <h3>خلاص فواتير / تحويل D17</h3>
        <select id="bill-opt">
            <option value="تحويل رصيد أو خلاص فاتورة">تواصل معنا للخدمة</option>
        </select>
        <button class="btn" onclick="order('خدمات بريدية', 'bill-opt')">ارسل طلبك</button>
    </div>

</div>

<a href="https://wa.me/21646326474" class="whatsapp-float" target="_blank">
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" width="35">
</a>

<script>
    // وظيفة البحث الحقيقي
    function searchProducts() {
        let input = document.getElementById('searchInput').value.toLowerCase();
        let cards = document.getElementsByClassName('card');
        for (let i = 0; i < cards.length; i++) {
            let title = cards[i].getElementsByTagName('h3')[0].innerText.toLowerCase();
            cards[i].style.display = title.includes(input) ? "" : "none";
        }
    }

    // وظيفة الطلب برقمك 21646326474
    function order(product, selectId) {
        let price = document.getElementById(selectId).value;
        let message = `سلام Click-TN، نحب نطلب ${product}: ${price}`;
        window.open(`https://wa.me/21646326474?text=${encodeURIComponent(message)}`, '_blank');
    }
</script>

</body>
</html>
