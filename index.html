<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click-TN Store | المتجر الكامل 🇹🇳</title>
    <style>
        :root { --primary: #e94560; --bg: #0f172a; --card: #1e293b; --success: #25d366; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f172a; color: white; margin: 0; text-align: center; }
        header { padding: 40px 20px; border-bottom: 3px solid var(--primary); background: #1e293b; }
        .logo { font-size: 2.5rem; font-weight: bold; margin: 0; }
        .logo span { color: var(--primary); }
        .container { padding: 25px; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; max-width: 1200px; margin: auto; }
        .card { background: var(--card); border-radius: 20px; overflow: hidden; padding-bottom: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.3); transition: 0.3s; }
        .card:hover { transform: translateY(-5px); }
        .card-image-box { width: 100%; height: 180px; background: white; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .card-image-box img { max-width: 90%; max-height: 90%; object-fit: contain; }
        .info { padding: 15px; }
        h3 { font-size: 1.2rem; margin: 10px 0; }
        select { width: 90%; padding: 12px; border-radius: 10px; margin-bottom: 15px; background: #0f172a; color: white; border: 1px solid #334155; font-size: 1rem; }
        .btn { background: var(--primary); color: white; width: 90%; padding: 15px; border-radius: 12px; font-weight: bold; border: none; cursor: pointer; font-size: 1.1rem; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(5px); }
        .modal-content { background: #1e293b; margin: 15% auto; padding: 25px; border-radius: 20px; width: 85%; max-width: 400px; border: 1px solid var(--primary); }
        .pay-btn { display: block; width: 100%; padding: 15px; margin: 10px 0; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; font-size: 1.1rem; }
        .d17 { background: #ffcc00; color: #000; }
        .flouci { background: #6c5ce7; color: #fff; }
    </style>
</head>
<body>

<header>
    <div class="logo">Click-<span>TN</span> Store</div>
    <p>شحن فوري للألعاب والاشتراكات في تونس 🇹🇳</p>
</header>

<div class="container">
    <div class="card">
        <div class="card-image-box">
            <img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg" alt="Netflix">
        </div>
        <div class="info">
            <h3>نتفليكس (Netflix Premium)</h3>
            <select id="netflix-options">
                <option value="شهر Premium بـ 15.000 DT">اشتراك شهر - 15.000 DT</option>
                <option value="3 أشهر Premium بـ 40.000 DT">3 أشهر - 40.000 DT</option>
            </select>
            <button onclick="openModal('Netflix 🎬', 'netflix-options')" class="btn">اطلب عبر واتساب</button>
        </div>
    </div>

    <div class="card">
        <div class="card-image-box">
            <img src="https://upload.wikimedia.org/wikipedia/commons/1/1a/Tether_Logo.svg" alt="USDT">
        </div>
        <div class="info">
            <h3>شراء عملة (USDT)</h3>
            <select id="usdt-options">
                <option value="10 USDT بـ 36.500 DT">10 USDT - 36.500 DT</option>
                <option value="50 USDT بـ 182.500 DT">50 USDT - 182.500 DT</option>
                <option value="100 USDT بـ 365.000 DT">100 USDT - 365.000 DT</option>
            </select>
            <button onclick="openModal('USDT 💵', 'usdt-options')" class="btn">اطلب عبر واتساب</button>
        </div>
    </div>

    <div class="card">
        <div class="card-image-box">
            <img src="https://upload.wikimedia.org/wikipedia/en/a/a9/TikTok_logo.svg" alt="TikTok">
        </div>
        <div class="info">
            <h3>تيك توك (TikTok Coins)</h3>
            <select id="tiktok-options">
                <option value="1000 Coin بـ 45.000 DT">1000 Coin - 45.000 DT</option>
                <option value="5000 Coin بـ 215.000 DT">5000 Coin - 215.000 DT</option>
            </select>
            <button onclick="openModal('TikTok Coins 📱', 'tiktok-options')" class="btn">اطلب عبر واتساب</button>
        </div>
    </div>

    <div class="card">
        <div class="card-image-box">
            <img src="https://upload.wikimedia.org/wikipedia/en/3/3c/Free_Fire_logo.png" alt="Free Fire">
        </div>
        <div class="info">
            <h3>فري فاير (Free Fire)</h3>
            <select id="ff-options">
                <option value="100 جوهرة بـ 4.000 DT">100 جوهرة - 4.000 DT</option>
                <option value="210 جوهرة بـ 8.200 DT">210 جوهرة - 8.200 DT</option>
                <option value="530 جوهرة بـ 18.500 DT">530 جوهرة - 18.500 DT</option>
            </select>
            <button onclick="openModal('Free Fire 💎', 'ff-options')" class="btn">اطلب عبر واتساب</button>
        </div>
    </div>

    <div class="card">
        <div class="card-image-box">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/0b/PUBG_Mobile_Logo.svg/1280px-PUBG_Mobile_Logo.svg.png" alt="PUBG">
        </div>
        <div class="info">
            <h3>ببجي موبايل (PUBG UC)</h3>
            <select id="pubg-options">
                <option value="60 UC بـ 4.500 DT">60 UC - 4.500 DT</option>
                <option value="300 UC بـ 19.500 DT">300 UC - 19.500 DT</option>
                <option value="600 UC بـ 38.000 DT">600 UC - 38.000 DT</option>
            </select>
            <button onclick="openModal('PUBG 🔫', 'pubg-options')" class="btn">اطلب عبر واتساب</button>
        </div>
    </div>

    <div class="card">
        <div class="card-image-box">
            <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg" alt="Apple">
        </div>
        <div class="info">
            <h3>آبل أمريكي (Apple Store)</h3>
            <select id="apple-options">
                <option value="2$ بـ 8.500 DT">بطاقة 2$ - 8.500 DT</option>
                <option value="10$ بـ 38.000 DT">بطاقة 10$ - 38.000 DT</option>
            </select>
            <button onclick="openModal('Apple Card 🍎', 'apple-options')" class="btn">اطلب عبر واتساب</button>
        </div>
    </div>
</div>

<div id="paymentModal" class="modal">
    <div class="modal-content">
        <h3>اختر وسيلة الدفع</h3>
        <button onclick="sendOrder('D17')" class="pay-btn d17">الدفع عبر D17 💳</button>
        <button onclick="sendOrder('Flouci')" class="pay-btn flouci">الدفع عبر Flouci 📱</button>
        <button onclick="closeModal()" style="background:none; color:gray; border:none; margin-top:15px; cursor:pointer;">إلغاء</button>
    </div>
</div>

<script>
    let currentP = ""; let currentC = "";
    function openModal(p, s) { currentP = p; currentC = document.getElementById(s).value; document.getElementById("paymentModal").style.display = "block"; }
    function closeModal() { document.getElementById("paymentModal").style.display = "none"; }
    function sendOrder(method) {
        let message = "مرحباً Click-TN Store 👋\n\n📌 المنتج: " + currentP + "\n💰 العرض: " + currentC + "\n💳 وسيلة الدفع: " + method;
        window.open("https://wa.me/21646326474?text=" + encodeURIComponent(message), '_blank');
        closeModal();
    }
</script>

</body>
</html>
