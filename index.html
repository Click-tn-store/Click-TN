<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click-TN Store | المتجر المتكامل 🇹🇳</title>
    <style>
        :root { --primary: #e94560; --bg: #0f172a; --card: #1e293b; --success: #25d366; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f172a; color: white; margin: 0; text-align: center; }
        header { padding: 30px; border-bottom: 3px solid var(--primary); background: #1e293b; }
        .logo { font-size: 2.5rem; font-weight: bold; }
        .logo span { color: var(--primary); }
        .container { padding: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; max-width: 1200px; margin: auto; }
        .card { background: var(--card); border-radius: 15px; overflow: hidden; padding-bottom: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); transition: 0.3s; border: 1px solid transparent; }
        .card:hover { transform: translateY(-5px); border-color: var(--primary); }
        .card-image-box { width: 100%; height: 200px; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #000; }
        .card-image-box img { width: 100%; height: 100%; object-fit: cover; }
        .info { padding: 15px; }
        h3 { font-size: 1.2rem; margin: 10px 0; }
        select { width: 90%; padding: 12px; border-radius: 8px; margin-bottom: 15px; background: #0f172a; color: white; border: 1px solid #334155; font-size: 0.95rem; cursor: pointer; }
        .btn { background: var(--primary); color: white; width: 90%; padding: 12px; border-radius: 10px; font-weight: bold; border: none; cursor: pointer; transition: 0.3s; font-size: 1rem; }
        .btn:hover { background: #ff2e63; }
        
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(5px); }
        .modal-content { background: #1e293b; margin: 15% auto; padding: 25px; border-radius: 15px; width: 85%; max-width: 350px; border: 1px solid var(--primary); }
        .pay-btn { display: block; width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; font-size: 1.1rem; }
        .d17 { background: #ffcc00; color: #000; }
        .flouci { background: #6c5ce7; color: #fff; }
        .whatsapp-float { position: fixed; bottom: 20px; right: 20px; background: var(--success); width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 999; font-size: 30px; }
    </style>
</head>
<body>

<header>
    <div class="logo">Click-<span>TN</span> Store</div>
    <p>شحن الألعاب، الاشتراكات، والتسوق العالمي 🇹🇳</p>
</header>

<div class="container">
    <div class="card">
        <div class="card-image-box"><img src="1000037394.png" alt="AliExpress"></div>
        <div class="info">
            <h3>AliExpress 📦</h3>
            <p style="font-size: 0.85rem; color: #cbd5e1; margin-bottom: 10px;">وسيط شراء من علي إكسبريس</p>
            <button onclick="directOrder('AliExpress 📦')" class="btn">اطلب عبر واتساب</button>
        </div>
    </div>

    <div class="card">
        <div class="card-image-box"><img src="1000037396.jpg" alt="Ubuy"></div>
        <div class="info">
            <h3>Ubuy 🛒</h3>
            <p style="font-size: 0.85rem; color: #cbd5e1; margin-bottom: 10px;">وسيط شراء من يوباي</p>
            <button onclick="directOrder('Ubuy 🛒')" class="btn">اطلب عبر واتساب</button>
        </div>
    </div>

    <div class="card">
        <div class="card-image-box"><img src="1000037391.jpg" alt="PUBG"></div>
        <div class="info">
            <h3>ببجي موبايل (UC)</h3>
            <select id="pubg-options">
                <option value="60 UC بـ 4.500 DT">60 UC - 4.500 DT</option>
                <option value="325 UC بـ 19.500 DT">325 UC - 19.500 DT</option>
                <option value="660 UC بـ 38.000 DT">660 UC - 38.000 DT</option>
                <option value="1800 UC بـ 95.000 DT">1800 UC - 95.000 DT</option>
                <option value="3850 UC بـ 185.000 DT">3850 UC - 185.000 DT</option>
                <option value="8100 UC بـ 360.000 DT">8100 UC - 360.000 DT</option>
            </select>
            <button onclick="openModal('ببجي موبايل 🔫', 'pubg-options')" class="btn">شحن الآن</button>
        </div>
    </div>

    <div class="card">
        <div class="card-image-box"><img src="1000037390.jpg" alt="Free Fire"></div>
        <div class="info">
            <h3>فري فاير (💎)</h3>
            <select id="ff-options">
                <option value="100 جوهرة بـ 4.000 DT">100 جوهرة - 4.000 DT</option>
                <option value="210 جوهرة بـ 8.200 DT">210 جوهرة - 8.200 DT</option>
                <option value="530 جوهرة بـ 18.500 DT">530 جوهرة - 18.500 DT</option>
                <option value="1080 جوهرة بـ 36.000 DT">1080 جوهرة - 36.000 DT</option>
                <option value="2200 جوهرة بـ 70.000 DT">2200 جوهرة - 70.000 DT</option>
                <option value="Weekly Lite بـ 8.000 DT">اشتراك أسبوعي Lite - 8.000 DT</option>
                <option value="Monthly بـ 35.000 DT">اشتراك شهري - 35.000 DT</option>
            </select>
            <button onclick="openModal('فري فاير 💎', 'ff-options')" class="btn">شحن الآن</button>
        </div>
    </div>

    <div class="card">
        <div class="card-image-box"><img src="1000037389.jpg" alt="USDT"></div>
        <div class="info">
            <h3>عملة USDT 💵</h3>
            <select id="usdt-options">
                <option value="10 USDT بـ 36.500 DT">10 USDT - 36.500 DT</option>
                <option value="20 USDT بـ 73.000 DT">20 USDT - 73.000 DT</option>
                <option value="50 USDT بـ 182.500 DT">50 USDT - 182.500 DT</option>
                <option value="100 USDT بـ 365.000 DT">100 USDT - 365.000 DT</option>
            </select>
            <button onclick="openModal('USDT 💵', 'usdt-options')" class="btn">اطلب الآن</button>
        </div>
    </div>

    <div class="card">
        <div class="card-image-box"><img src="1000037392.jpg" alt="Netflix"></div>
        <div class="info">
            <h3>نتفليكس (🎬)</h3>
            <select id="netflix-options">
                <option value="حساب مشترك شهر بـ 15.000 DT">حساب مشترك (شهر) - 15.000 DT</option>
                <option value="بروفايل خاص شهر بـ 25.000 DT">بروفايل خاص (شهر) - 25.000 DT</option>
                <option value="حساب كامل شهر بـ 60.000 DT">حساب كامل خاص (شهر) - 60.000 DT</option>
            </select>
            <button onclick="openModal('نتفليكس 🎬', 'netflix-options')" class="btn">اشترك الآن</button>
        </div>
    </div>

    <div class="card">
        <div class="card-image-box"><img src="1000037393.png" alt="TikTok"></div>
        <div class="info">
            <h3>تيك توك (📱)</h3>
            <select id="tiktok-options">
                <option value="70 Coin بـ 4.000 DT">70 Coin - 4.000 DT</option>
                <option value="350 Coin بـ 18.000 DT">350 Coin - 18.000 DT</option>
                <option value="700 Coin بـ 35.000 DT">700 Coin - 35.000 DT</option>
                <option value="1400 Coin بـ 68.000 DT">1400 Coin - 68.000 DT</option>
                <option value="3500 Coin بـ 165.000 DT">3500 Coin - 165.000 DT</option>
                <option value="7000 Coin بـ 320.000 DT">7000 Coin - 320.000 DT</option>
            </select>
            <button onclick="openModal('تيك توك 📱', 'tiktok-options')" class="btn">شحن الآن</button>
        </div>
    </div>
</div>

<div id="paymentModal" class="modal">
    <div class="modal-content">
        <h3>اختر وسيلة الدفع</h3>
        <button onclick="sendOrder('D17')" class="pay-btn d17">D17 💳</button>
        <button onclick="sendOrder('Flouci')" class="pay-btn flouci">Flouci 📱</button>
        <button onclick="closeModal()" style="background:none; color:white; border:none; margin-top:15px; cursor:pointer;">إلغاء</button>
    </div>
</div>

<a href="https://wa.me/21646326474" class="whatsapp-float" target="_blank">💬</a>

<script>
    let currentProductName = "";
    let currentProductOption = "";

    function openModal(name, selectId) {
        currentProductName = name;
        currentProductOption = document.getElementById(selectId).value;
        document.getElementById("paymentModal").style.display = "block";
    }

    function closeModal() {
        document.getElementById("paymentModal").style.display = "none";
    }

    function sendOrder(method) {
        let phone = "21646326474";
        let message = "مرحباً Click-TN Store 👋\n\n📌 المنتج: " + currentProductName + "\n💰 العرض: " + currentProductOption + "\n💳 وسيلة الدفع: " + method;
        window.open("https://wa.me/" + phone + "?text=" + encodeURIComponent(message), '_blank');
        closeModal();
    }

    function directOrder(platform) {
        let phone = "21646326474";
        let message = "مرحباً Click-TN Store 👋\n\nأريد الشراء من منصة: " + platform + "\nسأرسل لك رابط المنتج الآن.";
        window.open("https://wa.me/" + phone + "?text=" + encodeURIComponent(message), '_blank');
    }

    window.onclick = function(event) {
        if (event.target == document.getElementById("paymentModal")) { closeModal(); }
    }
</script>
</body>
</html>
