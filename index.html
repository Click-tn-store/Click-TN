<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click-TN Store | المتجر المتكامل 🇹🇳</title>
    <style>
        :root { 
            --primary: #e94560; 
            --bg: #0f172a; 
            --card: rgba(30, 41, 59, 0.8); 
            --success: #25d366; 
            --accent: #00d2ff;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            /* خلفية احترافية بتدرج ألوان متحرك */
            background: linear-gradient(-45deg, #0f172a, #1e293b, #0f172a, #16213e);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            color: white; 
            margin: 0; 
            text-align: center;
            min-height: 100vh;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        header { 
            padding: 40px 20px; 
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--primary);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }

        .logo { 
            font-size: 3rem; 
            font-weight: 900; 
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
        }
        .logo span { color: var(--primary); }

        .container { 
            padding: 20px; 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 30px; 
            max-width: 1300px; 
            margin: auto; 
        }

        .card { 
            background: var(--card); 
            backdrop-filter: blur(5px);
            border-radius: 20px; 
            overflow: hidden; 
            padding-bottom: 20px; 
            transition: all 0.4s ease; 
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        .card:hover { 
            transform: translateY(-10px) scale(1.02); 
            border-color: var(--primary); 
            box-shadow: 0 0 30px rgba(233, 69, 96, 0.3);
        }

        .card-image-box { 
            width: 100%; 
            height: 200px; 
            overflow: hidden; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background: #000;
            border-bottom: 2px solid rgba(233, 69, 96, 0.2);
        }
        .card-image-box img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .card:hover .card-image-box img { transform: scale(1.1); }

        .info { padding: 20px; }
        .info h3 { font-size: 1.4rem; margin-bottom: 15px; color: #fff; }

        select { 
            width: 95%; 
            padding: 12px; 
            border-radius: 12px; 
            margin-bottom: 20px; 
            background: #0f172a; 
            color: white; 
            border: 2px solid #334155;
            cursor: pointer;
            outline: none;
        }

        .btn { 
            background: linear-gradient(45deg, var(--primary), #ff2e63);
            color: white; 
            width: 95%; 
            padding: 14px; 
            border-radius: 12px; 
            font-weight: bold; 
            border: none; 
            cursor: pointer; 
            font-size: 1rem;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(233, 69, 96, 0.4);
        }
        .btn:hover { opacity: 0.9; transform: scale(0.98); }

        /* التنسيقات الأخرى كما هي لضمان عمل الأكواد */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(8px); }
        .modal-content { background: #1e293b; margin: 10% auto; padding: 30px; border-radius: 20px; width: 85%; max-width: 400px; border: 2px solid var(--primary); box-shadow: 0 0 50px rgba(0,0,0,0.5); }
        .pay-btn { display: block; width: 100%; padding: 15px; margin: 15px 0; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; font-size: 1.1rem; }
        .d17 { background: #ffcc00; color: #000; }
        .flouci { background: #6c5ce7; color: #fff; }
        .whatsapp-float { position: fixed; bottom: 30px; right: 30px; background: var(--success); width: 65px; height: 65px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 35px; box-shadow: 0 10px 25px rgba(37, 211, 102, 0.5); z-index: 100; transition: 0.3s; }
        .whatsapp-float:hover { transform: scale(1.1) rotate(10deg); }
    </style>
</head>

<a href="https://wa.me/21646326474" class="whatsapp-float" target="_blank">💬</a>

<script>
    let cP = ""; let cO = "";
    function openModal(p, s) { cP = p; cO = document.getElementById(s).value; document.getElementById("paymentModal").style.display = "block"; }
    function closeModal() { document.getElementById("paymentModal").style.display = "none"; }
    function sendOrder(m) {
        let msg = "مرحباً Click-TN Store 👋\nالمنتج: " + cP + "\nالعرض: " + cO + "\nالدفع: " + m;
        window.open("https://wa.me/21646326474?text=" + encodeURIComponent(msg), '_blank');
        closeModal();
    }
    function directOrder(p) {
        let msg = "مرحباً Click-TN Store 👋\nأريد الشراء من منصة: " + p;
        window.open("https://wa.me/21646326474?text=" + encodeURIComponent(msg), '_blank');
    }
</script>
